<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RusTili A1 — Interaktiv Platforma</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts: Manrope & Inter (Cyrillic + Latin) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    /* === BASE & CSS VARIABLES === */
    :root {
      --bg: #F4F7FB;
      --card: #FFFFFF;
      --card-subtle: #EDF2F9;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --accent-light: rgba(59, 130, 246, 0.14);
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --success-light: rgba(16, 185, 129, 0.14);
      --danger: #EF4444;
      --danger-light: rgba(239, 68, 68, 0.14);
      --warning: #F59E0B;
      --warning-light: rgba(245, 158, 11, 0.16);
      --btn-bg: #3B82F6;
      --btn-text: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --transition: 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      --gap-xs: 4px;
      --gap-sm: 8px;
      --gap-md: 16px;
      --gap-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body.dark-mode .card {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* === TYPOGRAPHY === */
    .t-display { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
    .t-h1 { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.2; letter-spacing: -0.015em; }
    .t-h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.25; }
    .t-h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; line-height: 1.3; }
    .t-body { font-family: var(--font-body); font-size: 14px; font-weight: 500; }
    .t-caption { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .t-tiny { font-family: var(--font-body); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

    /* === LAYOUT === */
    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      position: relative;
    }

    /* === STICKY HEADER === */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: transform var(--transition), background var(--transition);
    }
    .stat-pill:active { transform: scale(0.94); }
    .stat-pill.streak-pill {
      background: var(--warning-light);
      color: #D97706;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .stat-pill.coin-pill {
      background: rgba(234, 179, 8, 0.14);
      color: #CA8A04;
      border-color: rgba(234, 179, 8, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card-subtle);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
      position: relative;
      transition: transform var(--transition), background var(--transition);
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn .dot-notify {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 2px var(--card);
    }

    .xp-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lvl-badge {
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .progress-track {
      flex: 1;
      height: 9px;
      background: var(--card-subtle);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: shine 2.6s infinite;
    }

    .xp-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 66px;
      text-align: right;
    }

    /* === SCREENS & VIEWS === */
    .screen {
      display: none;
      padding: 14px;
      animation: fadeIn 0.22s ease;
    }
    .screen.active {
      display: block;
    }

    /* === CARDS & COMPONENTS === */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .card-interactive {
      cursor: pointer;
    }
    .card-interactive:active {
      transform: scale(0.98);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: var(--radius);
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-light);
      transition: transform var(--transition), background var(--transition), opacity var(--transition);
      width: 100%;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    .btn-secondary {
      background: var(--card-subtle);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
      box-shadow: 0 4px 12px var(--success-light);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 4px 12px var(--danger-light);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
      width: auto;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--card-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--accent-light);
      color: var(--accent);
    }

    /* === BOTTOM NAVIGATION === */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 60;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.06);
    }

    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: color var(--transition), transform var(--transition);
    }
    .nav-item:active { transform: scale(0.92); }
    .nav-item .nav-icon {
      font-size: 20px;
      transition: transform var(--transition);
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: 700;
    }
    .nav-item.active .nav-icon {
      transform: translateY(-2px) scale(1.08);
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      width: 28px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: var(--accent);
    }

    /* === 3D FLASHCARD === */
    .flashcard-scene {
      perspective: 1100px;
      width: 100%;
      height: 265px;
      margin: 12px 0;
    }

    .flashcard-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }
    .flashcard-3d.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .flashcard-back {
      transform: rotateY(180deg);
      border-color: var(--accent);
      background: linear-gradient(160deg, var(--card), var(--card-subtle));
    }

    /* === GRAMMAR & VOCAB LIST === */
    .grammar-box {
      border-left: 4px solid var(--accent);
      background: var(--card);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .grammar-box ul {
      padding-left: 18px;
      margin-top: 8px;
    }
    .grammar-box li {
      margin-bottom: 5px;
    }
    .grammar-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12.5px;
    }
    .grammar-table th, .grammar-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }
    .grammar-table th {
      background: var(--card-subtle);
      font-weight: 700;
    }

    .word-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--card);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .word-item.learned {
      border-left: 3px solid var(--success);
    }

    /* === QUIZ OPTIONS & BOOSTERS === */
    .booster-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .booster-bar::-webkit-scrollbar { display: none; }

    .booster-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: transform var(--transition), border-color var(--transition);
    }
    .booster-pill:active { transform: scale(0.94); }
    .booster-pill.disabled { opacity: 0.45; pointer-events: none; }

    .quiz-opt {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      margin-bottom: 9px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all var(--transition);
    }
    .quiz-opt:active { transform: scale(0.98); }
    .quiz-opt.correct {
      background: var(--success-light);
      border-color: var(--success);
      color: var(--success);
    }
    .quiz-opt.wrong {
      background: var(--danger-light);
      border-color: var(--danger);
      color: var(--danger);
      animation: shake 0.35s ease;
    }
    .quiz-opt.hidden-opt {
      opacity: 0.25;
      pointer-events: none;
      text-decoration: line-through;
    }

    /* === GAMES === */
    .letter-slots, .letter-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin: 12px 0;
      min-height: 44px;
    }
    .letter-tile {
      min-width: 38px;
      height: 42px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--card);
      border: 2px solid var(--border);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .letter-tile:active { transform: translateY(2px); }
    .letter-tile.filled {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }
    .letter-tile.used {
      opacity: 0.25;
      pointer-events: none;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .memory-card {
      aspect-ratio: 1 / 1.05;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: var(--shadow-sm);
    }
    .memory-card.face-down {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      font-size: 20px;
      border-color: transparent;
    }
    .memory-card.matched {
      background: var(--success-light);
      border-color: var(--success);
      color: var(--success);
      pointer-events: none;
      transform: scale(0.96);
    }

    /* === MODALS & TOASTS === */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 390px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-lg);
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 88vh;
      overflow-y: auto;
    }

    .toast-container {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }
    .toast {
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideUp 0.25s ease;
    }

    /* === ANIMATIONS === */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.88); }
      70% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }
    .bounce-anim { animation: popIn 0.35s ease; }
    .pulse-anim { animation: pulse 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- STICKY HEADER -->
    <header class="app-header">
      <div class="header-top">
        <div style="display:flex; align-items:center; gap:6px;">
          <div class="stat-pill coin-pill" id="headerCoinsBtn" onclick="Router.go('shop')">
            <span>🪙</span>
            <span id="uiCoins">100</span>
          </div>
          <div class="stat-pill streak-pill pulse-anim" onclick="UI.openStreakModal()">
            <span>🔥</span>
            <span id="uiStreak">1</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" onclick="UI.openStreakModal()" title="Kunlik sovg'a">
            🎁
            <span class="dot-notify" id="streakNotifyDot"></span>
          </button>
          <button class="icon-btn" onclick="Router.go('profile')" title="Profil">
            <span id="headerAvatar">🦊</span>
          </button>
        </div>
      </div>
      <div class="xp-row">
        <span class="lvl-badge" id="uiLevelBadge">1-Daraja</span>
        <div class="progress-track">
          <div class="progress-fill" id="uiXpBar" style="width: 15%;"></div>
        </div>
        <span class="xp-label" id="uiXpText">15/100 XP</span>
      </div>
    </header>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- SCREEN 1: DARSLAR (LESSONS) -->
    <main id="screen-lessons" class="screen active"></main>

    <!-- SCREEN 2: KARTALAR (FLASHCARDS) -->
    <section id="screen-cards" class="screen"></section>

    <!-- SCREEN 3: TEST (200 QUESTIONS) -->
    <section id="screen-test" class="screen"></section>

    <!-- SCREEN 4: O'YINLAR (MINI-GAMES) -->
    <section id="screen-games" class="screen"></section>

    <!-- SCREEN 5: DO'KON (SHOP) -->
    <section id="screen-shop" class="screen"></section>

    <!-- SCREEN 6: PROFIL (PROFILE & SETTINGS) -->
    <section id="screen-profile" class="screen"></section>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="lessons" onclick="Router.go('lessons')">
        <span class="nav-icon">📚</span>
        <span>Darslar</span>
      </button>
      <button class="nav-item" data-tab="cards" onclick="Router.go('cards')">
        <span class="nav-icon">🃏</span>
        <span>Kartalar</span>
      </button>
      <button class="nav-item" data-tab="test" onclick="Router.go('test')">
        <span class="nav-icon">🎯</span>
        <span>Test</span>
      </button>

        return {

          },

      init() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            this.state = Object.assign(this.getDefaultState(), parsed);
            this.state.settings = Object.assign(this.getDefaultState().settings, parsed.settings || {});
            this.state.boosters = Object.assign(this.getDefaultState().boosters, parsed.boosters || {});
            this.state.stats = Object.assign(this.getDefaultState().stats, parsed.stats || {});
            this.state.testState = Object.assign(this.getDefaultState().testState, parsed.testState || {});
          } else {
            this.state = this.getDefaultState();
            // Auto-detect Telegram dark scheme on first load
            if (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme === 'dark') {
              this.state.activeTheme = 'theme-2';
              if (!this.state.ownedThemes.includes('theme-2')) this.state.ownedThemes.push('theme-2');
            }
          }
        } catch (e) {
          this.state = this.getDefaultState();
        }
        this.checkDailyAndStreak();
        this.save();
      },

      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        } catch (e) {}
      },

      checkDailyAndStreak() {
        const today = new Date().toISOString().slice(0, 10);
        if (!this.state.daily || this.state.daily.date !== today) {
          this.state.daily = DEFAULT_DAILY_CHALLENGES();
        }
        if (this.state.lastLoginDate !== today) {
          const last = new Date(this.state.lastLoginDate);
          const now = new Date(today);
          const diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
          if (diffDays === 1) {
            this.state.streak = Math.min(365, (this.state.streak || 1) + 1);
          } else if (diffDays > 1) {
            this.state.streak = 1;
          }
          this.state.lastLoginDate = today;
          this.state.streakClaimedToday = false;
        }
      },

      addCoins(amount) {
        this.state.coins = Math.max(0, (this.state.coins || 0) + amount);
        this.save();
        UI.updateHeader(true);
        Achievements.checkAll();
      },

      addXp(amount) {
        this.state.xp = (this.state.xp || 0) + amount;
        const newLevel = Math.floor(this.state.xp / 100) + 1;
        if (newLevel > this.state.level) {
          this.state.level = newLevel;
          AudioEngine.play('levelup');
          UI.toast(`🎉 Tabriklaymiz! Siz ${newLevel}-darajaga ko'tarildingiz! (+25 🪙)`);
          this.state.coins += 25;
        }
        this.save();
        UI.updateHeader(false);
        Achievements.checkAll();
      },

      updateDailyChallenge(id, delta = 1) {
        if (!this.state.daily || !this.state.daily.items) return;
        const item = this.state.daily.items.find(i => i.id === id);
        if (item && !item.claimed) {
          item.progress = Math.min(item.target, item.progress + delta);
          if (item.progress >= item.target) {
            item.claimed = true;
            this.addCoins(item.rewardCoins);
            this.addXp(item.rewardXp);
            AudioEngine.play('coin');
            UI.toast(`✅ Kunlik vazifa bajarildi: +${item.rewardCoins} 🪙, +${item.rewardXp} XP!`);
          }
          this.save();
        }
      },

      getLearnedWordsCount() {
        return Object.values(this.state.wordStatus || {}).filter(v => v === 'known').length;
      },

      getTopicLearnedCount(topicId) {
        let count = 0;
        const prefix = topicId + '_';
        for (const k in this.state.wordStatus) {
          if (k.startsWith(prefix) && this.state.wordStatus[k] === 'known') count++;
        }
        return count;
      }
    };

    /* === 8. AUDIO & TTS ENGINE (WEB AUDIO API + WEB SPEECH API) === */
    const AudioEngine = {
      ctx: null,
      voices: [],

      init() {
        const unlock = () => {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        };
        document.addEventListener('pointerdown', unlock, { once: false, passive: true });

        if ('speechSynthesis' in window) {
          const loadVoices = () => {
            this.voices = window.speechSynthesis.getVoices() || [];
          };
          loadVoices();
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      },

      haptic(type = 'light') {
        try {
          if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
            if (type === 'success' || type === 'error' || type === 'warning') {
              Telegram.WebApp.HapticFeedback.notificationOccurred(type);
            } else {
              Telegram.WebApp.HapticFeedback.impactOccurred(type);
            }
          }
        } catch (e) {}
      },

      play(type) {
        if (!Store.state || !Store.state.settings.uiSound) return;
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const now = this.ctx.currentTime;

          if (type === 'click') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.055);
            this.haptic('light');
          } else if (type === 'success') {
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5-E5-G5-C6
            notes.forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.075);
              gain.gain.setValueAtTime(0.16, now + i * 0.075);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.075 + 0.16);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + i * 0.075);
              osc.stop(now + i * 0.075 + 0.17);
            });
            this.haptic('success');
          } else if (type === 'wrong') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(210, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.24);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.26);
            this.haptic('error');
          } else if (type === 'coin') {
            [987.77, 1318.51].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.15, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.18);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.19);
            });
          } else if (type === 'levelup' || type === 'badge') {
            const scale = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
            scale.forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              gain.gain.setValueAtTime(0.15, now + i * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.22);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.23);
            });
            this.haptic('success');
          } else if (type === 'flip' || type === 'swipe') {
            const bufferSize = this.ctx.sampleRate * 0.09;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.exponentialRampToValueAtTime(2400, now + 0.09);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
            this.haptic('light');
          }
        } catch (e) {}
      },

      speak(text) {
        if (!Store.state.settings.ttsEnabled) {
          UI.toast('🔇 Talaffuz ovozi Profil sozlamalarida o\'chirilgan');
          return;
        }
        if (!('speechSynthesis' in window)) {
          UI.toast('⚠️ Brauzeringiz ovozli o\'qishni qo\'llab-quvvatlamaydi');
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'ru-RU';
          utter.rate = Number(Store.state.settings.ttsRate) || 0.85;
          const ruVoice = (this.voices || []).find(v => v.lang && v.lang.toLowerCase().includes('ru'));
          if (ruVoice) utter.voice = ruVoice;
          window.speechSynthesis.speak(utter);
          Store.state.stats.ttsCount = (Store.state.stats.ttsCount || 0) + 1;
          Store.save();
          Achievements.checkAll();
          this.haptic('light');
        } catch (e) {}
      }
    };

          Store.updateDailyChallenge('dc_words', 1);

        }
        Store.save();
        this.renderLessonDetail(topicId);

      markAllTopicWords(topicId) {
        const topic = TOPICS.find(t => t.id === topicId);
        if (!topic) return;
        let newlyAdded = 0;
        topic.words.forEach((_, idx) => {
          const key = `${topicId}_${idx}`;
          if (Store.state.wordStatus[key] !== 'known') {
            Store.state.wordStatus[key] = 'known';
            newlyAdded++;
          }
        });
        if (newlyAdded > 0) {
          Store.addCoins(newlyAdded);
          Store.addXp(newlyAdded * 2);
          Store.updateDailyChallenge('dc_words', newlyAdded);
          AudioEngine.play('levelup');
          UI.toast(`🎉 ${newlyAdded} ta so'z yodlanganlar ro'yxatiga qo'shildi!`);
        }
        Store.save();
        this.renderLessonDetail(topicId);
      },

      openTopicFlashcards(topicId) {
        this.cardTopicId = topicId;
        this.cardIndex = 0;
        this.cardFlipped = false;
        Router.go('cards');
      },

        if (this.cardIndex < 0) this.cardIndex = words.length - 1;

        const status = Store.state.wordStatus[key];

        container.innerHTML = `
          <!-- TOPIC SELECTOR CHIPS -->
          <div class="booster-bar" style="margin-bottom:10px;">
            ${TOPICS.map(t => `
              <button class="chip ${t.id === topic.id ? 'active' : ''}" onclick="UI.selectCardTopic(${t.id})">
                ${t.id}. ${t.titleUz}
              </button>
            `).join('')}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">

          <div class="progress-track" style="height:7px; margin-bottom:12px;">

          <!-- 3D FLASHCARD SCENE -->

                <div class="t-display" style="color:var(--accent); margin-bottom:6px;">${word.ru}</div>

                  <div class="t-caption" style="margin-top:3px;">${word.exampleUz}</div>
                </div>
                <button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="event.stopPropagation(); AudioEngine.speak('${word.example.replace(/'/g, "\\'")}')">
                  🔊 Misolni eshitish
                </button>
              </div>
            </div>

          <div style="display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:8px; margin-bottom:10px;">

          </div>
        `;

        // Attach swipe listener
        const touchArea = document.getElementById('flashcardTouchArea');
        if (touchArea) {
          let startX = 0;

            const dx = e.changedTouches[0].screenX - startX;
            if (Math.abs(dx) > 48) {

        if (el) el.classList.toggle('is-flipped', this.cardFlipped);

        AudioEngine.play('swipe');
        this.cardIndex += delta;
        this.cardFlipped = false;
        this.renderFlashcards();
      },

      markCardSrs(status) {
        const key = `${this.cardTopicId}_${this.cardIndex}`;

          <!-- STATS GRID -->

              <div class="t-caption">Yodlangan so'zlar</div>

              ${ACHIEVEMENTS.map(ach => {

                return `
                  <div onclick="UI.toast('${ach.icon} ${ach.nameUz}: ${ach.descUz}')" style="padding:8px 4px; border-radius:12px; text-align:center; border:1px solid ${unlocked ? 'var(--accent)' : 'var(--border)'}; background:${unlocked ? 'var(--accent-light)' : 'var(--card-subtle)'}; opacity:${unlocked ? '1' : '0.45'}; cursor:pointer;">
                    <div style="font-size:22px;">${ach.icon}</div>
                    <div style="font-size:10px; font-weight:700; margin-top:4px; line-height:1.15;">${ach.nameUz}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- SETTINGS -->
          <div class="card">
            <h3 class="t-h3" style="margin-bottom:10px;">⚙️ Sozlamalar va Ovoz</h3>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
              <span>🔊 Interfeys tovushlari (Web Audio)</span>
              <button class="btn btn-sm ${s.settings.uiSound ? 'btn-success' : 'btn-secondary'}" onclick="UI.toggleSetting('uiSound')">
                ${s.settings.uiSound ? 'Yoqilgan' : 'O\'chirilgan'}
              </button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
              <span>🗣️ Ruscha talaffuz (TTS)</span>
              <button class="btn btn-sm ${s.settings.ttsEnabled ? 'btn-success' : 'btn-secondary'}" onclick="UI.toggleSetting('ttsEnabled')">
                ${s.settings.ttsEnabled ? 'Yoqilgan' : 'O\'chirilgan'}
              </button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
              <span>🐢 Talaffuz tezligi</span>
              <div style="display:flex; gap:4px;">
                ${[0.7, 0.85, 1.0].map(r => `
                  <button class="btn btn-sm ${Number(s.settings.ttsRate) === r ? '' : 'btn-secondary'}" onclick="UI.setTtsRate(${r})">${r}x</button>
                `).join('')}
              </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
              <button class="btn btn-secondary btn-sm" onclick="UI.exportProgress()">📤 Eksport (JSON)</button>
              <button class="btn btn-secondary btn-sm" onclick="UI.importProgress()">📥 Import (JSON)</button>
            </div>
            <button class="btn btn-danger btn-sm" style="width:100%; margin-top:8px;" onclick="UI.resetProgress()">🗑️ Progressni tozalash</button>
          </div>
        `;
      },

      setAvatar(av) {
        Store.state.avatar = av;
        Store.save();
        this.updateHeader();
        this.renderProfile();
      },

      saveNick() {
        const inp = document.getElementById('nickInput');
        if (inp && inp.value.trim()) {
          Store.state.nick = inp.value.trim();
          Store.save();
          this.toast('✅ Ismingiz saqlandi!');
        }
      },

      toggleSetting(key) {
        Store.state.settings[key] = !Store.state.settings[key];
        Store.save();
        AudioEngine.play('click');
        this.renderProfile();
      },

      setTtsRate(rate) {
        Store.state.settings.ttsRate = rate;
        Store.save();
        AudioEngine.speak('Привет!');
        this.renderProfile();
      },

      exportProgress() {
        const data = JSON.stringify(Store.state);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(data);
          this.toast('📋 Progress JSON nusxalandi!');
        } else {
          prompt('Progress JSON nusxalab oling:', data);
        }
      },

      importProgress() {
        const raw = prompt('Saqlangan JSON progressni kiriting:');
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          Store.state = Object.assign(Store.getDefaultState(), parsed);
          Store.save();
          this.applyTheme(Store.state.activeTheme);
          this.updateHeader();
          this.renderProfile();
          this.toast('✅ Progress muvaffaqiyatli tiklandi!');
        } catch (e) {
          this.toast('❌ Noto\'g\'ri JSON format!');
        }
      },

      resetProgress() {
        if (confirm('Barcha yutuq va tangalarni boshidan boshlashni xohlaysizmi?')) {
          localStorage.removeItem(STORAGE_KEY);
          Store.init();
          this.applyTheme(Store.state.activeTheme);
          this.updateHeader();
          Router.go('lessons');
          this.toast('🔄 Progress yangilandi');
        }
      }
    };

    /* === 12. QUIZ MODULE (200 QUESTIONS + BOOSTERS) === */
    const Quiz = {
      filterTopicId: 0, // 0 = All 200 questions
      hiddenOpts: [],
      extraLifeActive: false,
      hintShown: false,
      showSummary: false,

      startForTopic(topicId) {
        this.filterTopicId = topicId;
        this.showSummary = false;
        const firstIdx = TEST_QUESTIONS.findIndex(q => q.topicId === topicId);
        if (firstIdx >= 0) Store.state.testState.currentIdx = firstIdx;
        Router.go('test');
      },

      getActivePool() {
        if (this.filterTopicId > 0) {
          return TEST_QUESTIONS.filter(q => q.topicId === this.filterTopicId);
        }
        return TEST_QUESTIONS;
      },

      render() {
        const container = document.getElementById('screen-test');
        const s = Store.state;
        const pool = this.getActivePool();

        if (this.showSummary) {
          this.renderSummary(container);
          return;
        }

        let currentQ = TEST_QUESTIONS[s.testState.currentIdx] || TEST_QUESTIONS[0];
        if (this.filterTopicId > 0 && currentQ.topicId !== this.filterTopicId) {
          currentQ = pool[0] || TEST_QUESTIONS[0];
          s.testState.currentIdx = currentQ.id - 1;
        }

        const qIdx = currentQ.id - 1;
        const savedAns = s.testState.answers[qIdx];
        const answeredCount = Object.keys(s.testState.answers || {}).length;
        const topicObj = TOPICS.find(t => t.id === currentQ.topicId) || TOPICS[0];

        container.innerHTML = `
          <!-- TOPIC FILTER BAR -->
          <div class="booster-bar" style="margin-bottom:8px;">
            <button class="chip ${this.filterTopicId === 0 ? 'active' : ''}" onclick="Quiz.setTopicFilter(0)">
              🎯 Barcha 200 savol
            </button>
            ${TOPICS.map(t => `
              <button class="chip ${this.filterTopicId === t.id ? 'active' : ''}" onclick="Quiz.setTopicFilter(${t.id})">
                ${t.id}. ${t.titleUz}
              </button>
            `).join('')}
          </div>

          <!-- BOOSTERS BAR -->
          <div class="booster-bar">
            <button class="booster-pill ${s.boosters.doubleCoin <= 0 ? 'disabled' : ''}" onclick="Quiz.useBooster('doubleCoin')">
              🪙 2x Tanga (${s.boosters.doubleCoin})
            </button>
            <button class="booster-pill ${s.boosters.fiftyFifty <= 0 || savedAns ? 'disabled' : ''}" onclick="Quiz.useBooster('fiftyFifty')">
              ✂️ 50/50 (${s.boosters.fiftyFifty})
            </button>
            <button class="booster-pill ${s.boosters.hint <= 0 || savedAns ? 'disabled' : ''}" onclick="Quiz.useBooster('hint')">
              💡 Maslahat (${s.boosters.hint})
            </button>
            <button class="booster-pill ${s.boosters.extraLife <= 0 || savedAns ? 'disabled' : ''}" onclick="Quiz.useBooster('extraLife')">
              ❤️ Imkon (${s.boosters.extraLife})
            </button>
            <button class="booster-pill ${s.boosters.skipQuestion <= 0 || savedAns ? 'disabled' : ''}" onclick="Quiz.useBooster('skipQuestion')">
              ⏭️ O'tkazish (${s.boosters.skipQuestion})
            </button>
          </div>

          <!-- PROGRESS HEADER -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="badge">Savol #${currentQ.id} / 200</span>
            <span class="t-caption" style="font-weight:700;">🔥 Ketma-ket: ${s.testState.correctStreak} | Javob berildi: ${answeredCount}/200</span>
          </div>
          <div class="progress-track" style="height:7px; margin-bottom:12px;">
            <div class="progress-fill" style="width:${Math.round((answeredCount / 200) * 100)}%;"></div>
          </div>

          <!-- QUESTION CARD -->
          <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <span class="t-tiny" style="color:var(--accent);">${topicObj.id}-Mavzu: ${topicObj.titleUz}</span>
              <span class="t-tiny">${'⭐'.repeat(currentQ.difficulty)}</span>
            </div>
            <h2 class="t-h2" style="margin-bottom:14px;">${currentQ.q}</h2>

            ${this.hintShown ? `
              <div style="padding:9px 12px; border-radius:10px; background:var(--warning-light); color:#B45309; font-size:12.5px; margin-bottom:12px;">
                💡 <b>Maslahat:</b> «${topicObj.grammar.title}» qoidasiga e'tibor bering. To'g'ri javob: <b>${currentQ.opts[currentQ.a].slice(0, 2)}...</b> bilan boshlanadi!
              </div>
            ` : ''}

            ${this.extraLifeActive ? `
              <div class="badge" style="margin-bottom:10px; background:var(--danger-light); color:var(--danger);">❤️ Ikkinchi imkon faol!</div>
            ` : ''}

            <div>
              ${currentQ.opts.map((opt, idx) => {
                let cls = 'quiz-opt';
                if (this.hiddenOpts.includes(idx)) cls += ' hidden-opt';
                if (savedAns) {
                  if (idx === currentQ.a) cls += ' correct';
                  else if (idx === savedAns.selected && !savedAns.isCorrect) cls += ' wrong';
                }
                return `
                  <button class="${cls}" onclick="Quiz.selectAnswer(${qIdx}, ${idx})">
                    <span>${['A', 'B', 'C', 'D'][idx]}) ${opt}</span>
                    <span>${savedAns && idx === currentQ.a ? '✅' : savedAns && idx === savedAns.selected && !savedAns.isCorrect ? '❌' : ''}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- NAV BUTTONS -->
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
            <button class="btn btn-secondary" onclick="Quiz.navigate(-1)">⬅️ Oldingi</button>
            <button class="btn btn-secondary" onclick="Quiz.showSummary = true; Quiz.render()">📊 Natija</button>
            <button class="btn" onclick="Quiz.navigate(1)">Keyingi ➡️</button>
          </div>
        `;
      },

      setTopicFilter(topicId) {
        AudioEngine.play('click');
        this.filterTopicId = topicId;
        this.hiddenOpts = [];
        this.hintShown = false;
        if (topicId > 0) {
          const firstIdx = TEST_QUESTIONS.findIndex(q => q.topicId === topicId);
          if (firstIdx >= 0) Store.state.testState.currentIdx = firstIdx;
        }
        this.render();
      },

      selectAnswer(qIdx, optIdx) {
        const s = Store.state;
        if (s.testState.answers[qIdx]) return;

        const q = TEST_QUESTIONS[qIdx];
        const isCorrect = optIdx === q.a;

        if (!isCorrect && this.extraLifeActive) {
          this.extraLifeActive = false;
          this.hiddenOpts.push(optIdx);
          AudioEngine.play('wrong');
          UI.toast('❤️ Ikkinchi imkon sizni xatodan qutqardi! Yana tanlang.');
          this.render();
          return;
        }

        s.testState.answers[qIdx] = { selected: optIdx, isCorrect };

        if (isCorrect) {
          s.testState.correctStreak = (s.testState.correctStreak || 0) + 1;
          if (s.testState.correctStreak > (s.testState.bestStreak || 0)) {
            s.testState.bestStreak = s.testState.correctStreak;
          }
          let coinReward = 5;
          if (s.testState.doubleCoinRemaining > 0) {
            coinReward *= 2;
            s.testState.doubleCoinRemaining--;
          }
          Store.addCoins(coinReward);
          Store.addXp(10);
          Store.updateDailyChallenge('dc_quiz', 1);
          AudioEngine.play('success');
          UI.spawnConfetti();
        } else {
          s.testState.correctStreak = 0;
          AudioEngine.play('wrong');
        }

        Store.save();
        Achievements.checkAll();
        this.render();
      },

      useBooster(key) {
        const s = Store.state;
        if ((s.boosters[key] || 0) <= 0) return;
        const qIdx = s.testState.currentIdx;
        const q = TEST_QUESTIONS[qIdx];

        s.boosters[key]--;
        AudioEngine.play('coin');

        if (key === 'doubleCoin') {
          s.testState.doubleCoinRemaining = (s.testState.doubleCoinRemaining || 0) + 5;
          UI.toast('🪙 Keyingi 5 ta to\'g\'ri javob uchun 2x Tanga yoqildi!');
        } else if (key === 'fiftyFifty') {
          const wrongIndices = [0, 1, 2, 3].filter(i => i !== q.a);
          this.hiddenOpts = wrongIndices.slice(0, 2);
          UI.toast('✂️ 2 ta noto\'g\'ri javob olib tashlandi!');
        } else if (key === 'hint') {
          this.hintShown = true;
        } else if (key === 'extraLife') {
          this.extraLifeActive = true;
          UI.toast('❤️ Ikkinchi imkon yoqildi!');
        } else if (key === 'skipQuestion') {
          s.testState.answers[qIdx] = { selected: q.a, isCorrect: true };
          Store.addCoins(5);
          Store.addXp(10);
          UI.toast('⏭️ Savol to\'g\'ri deb hisoblandi!');
        }
        Store.save();
        this.render();
      },

      navigate(delta) {
        AudioEngine.play('click');
        this.hiddenOpts = [];
        this.hintShown = false;
        this.extraLifeActive = false;

        const pool = this.getActivePool();
        const currId = TEST_QUESTIONS[Store.state.testState.currentIdx].id;
        const pos = pool.findIndex(q => q.id === currId);
        let nextPos = pos + delta;
        if (nextPos >= pool.length) nextPos = 0;
        if (nextPos < 0) nextPos = pool.length - 1;
        Store.state.testState.currentIdx = pool[nextPos].id - 1;
        Store.save();
        this.render();
      },

      renderSummary(container) {
        const s = Store.state;
        const ansList = Object.values(s.testState.answers || {});
        const total = ansList.length;
        const correct = ansList.filter(a => a && a.isCorrect).length;
        const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

        container.innerHTML = `
          <div class="card" style="text-align:center; padding:24px 16px;">
            <div style="font-size:52px; margin-bottom:8px;">🏆</div>
            <h1 class="t-h1">Test Natijalari</h1>
            <p class="t-caption" style="margin-top:4px;">200 ta savoldan ishlangan qismi bo'yicha ko'rsatkich</p>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0;">
              <div class="card" style="margin:0; background:var(--card-subtle);">
                <div class="t-h1" style="color:var(--success);">${correct} / 200</div>
                <div class="t-caption">To'g'ri javoblar</div>
              </div>
              <div class="card" style="margin:0; background:var(--card-subtle);">
                <div class="t-h1" style="color:var(--accent);">${pct}%</div>
                <div class="t-caption">Aniqlik darajasi</div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
              <button class="btn" onclick="Quiz.showSummary = false; Quiz.render()">▶️ Testni davom ettirish</button>
              <button class="btn btn-success" onclick="Quiz.shareResult(${correct}, ${pct})">📤 Do'stlarga ulashish (Telegram)</button>
              <button class="btn btn-danger" onclick="Quiz.resetTest()">🔄 Testni qaytadan boshlash</button>
            </div>
          </div>
        `;
      },

      shareResult(correct, pct) {
        const text = `🎯 Men RusTili A1 platformasida ${correct}/200 ta savolga (${pct}% aniqlik) to'g'ri javob berdim va ${Store.getLearnedWordsCount()} ta ruscha so'z o'rgandim!`;
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.switchInlineQuery) {
          try {
            Telegram.WebApp.switchInlineQuery(text, ['users', 'groups']);
            return;
          } catch (e) {}
        }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          UI.toast('📋 Natija matni nusxalandi! Do\'stlarga yuboring.');
        }
      },

      resetTest() {
        Store.state.testState.answers = {};
        Store.state.testState.currentIdx = 0;
        Store.state.testState.correctStreak = 0;
        Store.save();
        this.showSummary = false;
        this.render();
      }
    };

      /* GAME 1: SO'Z QURUVCHISI (WORD BUILDER) */
      startWordBuilder() {
        this.clearTimers();
        Store.state.stats.gamesPlayed++;
        Store.save();

        const pool = this.getAllWordsPool().filter(w => /^[А-Яа-яЁё]{3,9}$/.test(w.ru));
        const target = pool[Math.floor(Math.random() * pool.length)];
        const cleanWord = target.ru.toUpperCase();
        const letters = cleanWord.split('').map((ch, idx) => ({ ch, idx, used: false }));
        // Shuffle
        for (let i = letters.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [letters[i], letters[j]] = [letters[j], letters[i]];
        }

        this.builderState = { target, cleanWord, letters, chosen: [] };
        this.renderWordBuilder();
      },

      renderWordBuilder() {
        const container = document.getElementById('screen-games');
        const st = this.builderState;

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <button class="btn btn-secondary btn-sm" onclick="Games.renderMenu()">⬅️ O'yinlar</button>
            <span class="badge">🔤 So'z Quruvchisi</span>
          </div>

          <div class="card" style="text-align:center;">
            <div class="t-tiny" style="color:var(--text-muted);">SHU SO'ZNI RUS TILIDA TERING:</div>
            <div class="t-h1" style="color:var(--accent); margin:6px 0;">«${st.target.uz}»</div>
            <button class="btn btn-secondary btn-sm" onclick="AudioEngine.speak('${st.target.ru.replace(/'/g, "\\'")}')">🔊 Eshitib ko'rish</button>

            <div class="letter-slots">
              ${Array.from({ length: st.cleanWord.length }).map((_, idx) => {
                const picked = st.chosen[idx];
                return `
                  <div class="letter-tile ${picked ? 'filled' : ''}" onclick="Games.unpickLetter(${idx})">
                    ${picked ? picked.ch : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="letter-pool">
              ${st.letters.map((item, idx) => `
                <div class="letter-tile ${item.used ? 'used' : ''}" onclick="Games.pickLetter(${idx})">
                  ${item.ch}
                </div>
              `).join('')}
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;">
              <button class="btn btn-secondary" onclick="Games.clearBuilder()">🔄 Tozalash</button>
              <button class="btn btn-success" onclick="Games.checkBuilder()">✅ Tekshirish</button>
            </div>
          </div>
        `;
      },

      pickLetter(poolIdx) {
        const st = this.builderState;
        if (st.letters[poolIdx].used || st.chosen.length >= st.cleanWord.length) return;
        AudioEngine.play('click');
        st.letters[poolIdx].used = true;
        st.chosen.push({ ch: st.letters[poolIdx].ch, poolIdx });
        this.renderWordBuilder();
      },

      unpickLetter(slotIdx) {
        const st = this.builderState;
        const item = st.chosen[slotIdx];
        if (!item) return;
        AudioEngine.play('click');
        st.letters[item.poolIdx].used = false;
        st.chosen.splice(slotIdx, 1);
        this.renderWordBuilder();
      },

      clearBuilder() {
        const st = this.builderState;
        st.chosen = [];
        st.letters.forEach(l => l.used = false);
        AudioEngine.play('click');
        this.renderWordBuilder();
      },

      checkBuilder() {
        const st = this.builderState;
        const attempt = st.chosen.map(c => c.ch).join('');
        if (attempt === st.cleanWord) {
          AudioEngine.play('success');
          AudioEngine.speak(st.target.ru);
          UI.spawnConfetti();
          Store.state.stats.gamesWon++;
          Store.state.stats.builderWords = (Store.state.stats.builderWords || 0) + 1;
          Store.addCoins(15);
          Store.addXp(15);
          Store.updateDailyChallenge('dc_game', 1);
          UI.toast(`🎉 Barakalla! «${st.target.ru}» (+15 🪙)`);
          setTimeout(() => this.startWordBuilder(), 1000);
        } else {
          AudioEngine.play('wrong');
          UI.toast('❌ Harflar ketma-ketligi xato, qayta urinib ko\'ring!');
        }
      },

      /* GAME 2: JUFTLIKNI TOP (4x4 MEMORY MATCH) */
      startMemoryMatch() {
        this.clearTimers();
        Store.state.stats.gamesPlayed++;
        Store.save();

        const pool = this.getAllWordsPool().slice().sort(() => Math.random() - 0.5).slice(0, 8);
        const deck = [];
        pool.forEach((w, idx) => {
          deck.push({ pairId: idx, text: w.ru, lang: 'ru', matched: false, flipped: false });
          deck.push({ pairId: idx, text: w.uz, lang: 'uz', matched: false, flipped: false });
        });
        deck.sort(() => Math.random() - 0.5);

        this.memState = { deck, firstIdx: null, secondIdx: null, moves: 0, matches: 0, seconds: 0, locked: false };
        this.timerInterval = setInterval(() => {
          this.memState.seconds++;
          const timerEl = document.getElementById('memTimer');
          if (timerEl) timerEl.textContent = `${this.memState.seconds}s`;
        }, 1000);
        this.renderMemoryMatch();
      },

      renderMemoryMatch() {
        const container = document.getElementById('screen-games');
        const st = this.memState;

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button class="btn btn-secondary btn-sm" onclick="Games.renderMenu()">⬅️ O'yinlar</button>
            <div style="display:flex; gap:6px;">
              <span class="badge" id="memTimer">${st.seconds}s</span>
              <span class="badge">Yurish: ${st.moves}</span>
            </div>
          </div>

          <div class="memory-grid">
            ${st.deck.map((c, idx) => {
              const isVisible = c.flipped || c.matched;
              return `
                <div class="memory-card ${c.matched ? 'matched' : !isVisible ? 'face-down' : ''}" onclick="Games.flipMemoryCard(${idx})">
                  ${isVisible ? c.text : '❓'}
                </div>
              `;
            }).join('')}
          </div>
        `;
      },

      flipMemoryCard(idx) {
        const st = this.memState;
        if (st.locked || st.deck[idx].flipped || st.deck[idx].matched) return;

        AudioEngine.play('flip');
        st.deck[idx].flipped = true;
        if (st.deck[idx].lang === 'ru') AudioEngine.speak(st.deck[idx].text);

        if (st.firstIdx === null) {
          st.firstIdx = idx;
          this.renderMemoryMatch();
        } else {
          st.secondIdx = idx;
          st.moves++;
          st.locked = true;
          this.renderMemoryMatch();

          const c1 = st.deck[st.firstIdx];
          const c2 = st.deck[st.secondIdx];

          if (c1.pairId === c2.pairId) {
            setTimeout(() => {
              c1.matched = true;
              c2.matched = true;
              st.firstIdx = null;
              st.secondIdx = null;
              st.locked = false;
              st.matches++;
              AudioEngine.play('success');
              if (st.matches === 8) {
                this.clearTimers();
                Store.state.stats.gamesWon++;
                Store.state.stats.memoryWins = (Store.state.stats.memoryWins || 0) + 1;
                Store.addCoins(15);
                Store.addXp(20);
                Store.updateDailyChallenge('dc_game', 1);
                UI.spawnConfetti();
                UI.toast(`🏆 Barcha 8 juftlik topildi! +15 🪙`);
              }
              this.renderMemoryMatch();
            }, 350);
          } else {
            setTimeout(() => {
              c1.flipped = false;
              c2.flipped = false;
              st.firstIdx = null;
              st.secondIdx = null;
              st.locked = false;
              this.renderMemoryMatch();
            }, 680);
          }
        }
      },

      /* GAME 3: TEZKOR TARJIMA (SPEED TRANSLATE 10s) */
      startSpeedTranslate() {
        this.clearTimers();
        Store.state.stats.gamesPlayed++;
        Store.save();
        this.speedState = { score: 0, timeLeft: 10, target: null, options: [] };
        this.nextSpeedRound();
      },

      nextSpeedRound() {
        this.clearTimers();
        const pool = this.getAllWordsPool();
        const target = pool[Math.floor(Math.random() * pool.length)];
        const distractors = pool.filter(w => w.uz !== target.uz).sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [target, ...distractors].sort(() => Math.random() - 0.5);

        this.speedState.target = target;
        this.speedState.options = options;
        this.speedState.timeLeft = 10;

        this.timerInterval = setInterval(() => {
          this.speedState.timeLeft--;
          const bar = document.getElementById('speedTimerBar');
          const txt = document.getElementById('speedTimerTxt');
          if (bar) bar.style.width = `${this.speedState.timeLeft * 10}%`;
          if (txt) txt.textContent = `⏱️ ${this.speedState.timeLeft} soniya`;
          if (this.speedState.timeLeft <= 0) {
            this.clearTimers();
            AudioEngine.play('wrong');
            UI.toast('⏰ Vaqt tugadi!');
            this.nextSpeedRound();
          }
        }, 1000);

        this.renderSpeedTranslate();
      },

              const isOwned = s.ownedThemes.includes(theme.id);

                </div>
              `;
            }).join('')}
          </div>
        `;
      },

      renderBoosters(s) {
        return `
          <div>
            ${SHOP_BOOSTERS.map(b => `
              <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                <div style="font-size:32px;">${b.icon}</div>

        const theme = SHOP_THEMES.find(t => t.id === themeId);

        if (s.coins < theme.price) {

        }

        s.coins -= theme.price;
        s.ownedThemes.push(themeId);
        s.activeTheme = themeId;
        Store.save();
        AudioEngine.play('coin');
        UI.applyTheme(themeId);
        UI.updateHeader(true);
        Achievements.checkAll();
        UI.toast(`🎨 «${theme.name}» mavzusi xarid qilindi va o'rnatildi!`);
        this.render();
      },

      equipTheme(themeId) {
        Store.state.activeTheme = themeId;
        Store.save();
        AudioEngine.play('click');
        UI.applyTheme(themeId);
        this.render();
      },

      buyBooster(key) {
        const b = SHOP_BOOSTERS.find(item => item.key === key);
        const s = Store.state;
        if (!b) return;

        if (s.coins < b.price) {
          AudioEngine.play('wrong');
          UI.toast(`❌ Tangalar yetarli emas!`);
          return;
        }

        s.coins -= b.price;
        s.boostersBoughtCount = (s.boostersBoughtCount || 0) + 1;
        if (key === 'instantXp') {
          Store.addXp(100);
          UI.toast(`⚡ Darhol +100 XP qo'shildi!`);
        } else {
          s.boosters[key] = (s.boosters[key] || 0) + 1;
          UI.toast(`${b.icon} «${b.name}» xarid qilindi!`);
        }
        Store.save();
        AudioEngine.play('coin');
        UI.updateHeader(true);
        Achievements.checkAll();
        this.render();
      }
    };

    /* === 15. INITIALIZATION & TELEGRAM SDK === */
    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.Telegram && Telegram.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();
          if (Telegram.WebApp.BackButton) {
            Telegram.WebApp.BackButton.onClick(() => {
              Router.go('lessons');
            });
          }
        }
      } catch (e) {}

      Store.init();
      AudioEngine.init();
      UI.applyTheme(Store.state.activeTheme);
      UI.updateHeader(false);
      Router.go('lessons');
    });
  </script>
